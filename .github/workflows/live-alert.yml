name: AsianJeff live alert

on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 minutes (GitHub often runs it a few minutes late)
  workflow_dispatch:         # adds a "Run workflow" button for testing

permissions:
  contents: write            # lets it save state.txt so you only get one alert per stream

concurrency: live-alert      # never run two checks at the same time

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Twitch
        run: python3 check_live.py
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          CHANNEL: asianjeff
          GAME_FILTER: Grand Theft Auto

      - name: Remember this stream
        run: |
          if [ -n "$(git status --porcelain state.txt)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.txt
            git commit -m "Alerted for stream"
            git push
          fi
